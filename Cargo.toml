[package]
name = "c6-bank"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async C6 Bank Pix SDK with mutual TLS and shared OAuth authentication"
repository = "https://github.com/wuzi/c6-bank"
readme = "README.md"
keywords = ["c6", "pix", "payments", "sdk"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
